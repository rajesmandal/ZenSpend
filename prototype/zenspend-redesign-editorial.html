<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZenSpend – Editorial</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFE6;--ink:#1B1A17;--mut:#7B756A;--line:rgba(27,26,23,.14);--acc:#B5472B;--pos:#2F6B4F;--soft:#EAE3D4}
[data-theme=dark]{--bg:#151412;--ink:#F1ECE1;--mut:#8D877B;--line:rgba(241,236,225,.14);--acc:#E07A57;--pos:#7FCBA0;--soft:#211F1B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;min-height:100vh;background:#2a2824;color:#fff;display:grid;grid-template-columns:230px 390px 230px;gap:44px;justify-content:center;align-items:center;padding:30px}
.side h1{font-family:Fraunces,serif;font-size:32px;line-height:1.05;font-weight:600}.side h1 em{color:#E07A57}
.side p{color:#b5b0a3;font-size:13px;line-height:1.5;margin:12px 0 18px}
.nl button,.tgl{all:unset;display:block;cursor:pointer;padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;color:#b5b0a3;margin-bottom:4px}
.nl button.on{background:#F4EFE6;color:#1B1A17}.tgl{background:#E07A57;color:#151412;text-align:center}
.phone{width:390px;height:844px;border-radius:54px;background:#000;padding:10px;box-shadow:0 0 0 2px #444,0 40px 80px -20px #000}
.screen{height:100%;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;position:relative}
.status{height:46px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:13px;font-weight:600}
.view{flex:1;overflow-y:auto;scrollbar-width:none;padding:8px 24px 24px}.view::-webkit-scrollbar{display:none}
.serif{font-family:Fraunces,serif}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
h1.t{font-family:Fraunces,serif;font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.rule{border-top:1.5px solid var(--ink);margin:18px 0 14px}.hr{border-top:1px solid var(--line)}
.hero{font-family:Fraunces,serif;font-size:60px;font-weight:600;letter-spacing:-.04em;line-height:1;margin:8px 0 6px}
.hero sup{font-size:26px;vertical-align:top;margin-right:3px;color:var(--mut)}
.delta{font-size:13px;color:var(--pos);font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr}.cols>div{padding:14px 0}.cols>div+div{padding-left:18px;border-left:1px solid var(--line)}
.num{font-family:Fraunces,serif;font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 4px}
.sec b{font-family:Fraunces,serif;font-size:22px;font-weight:600}.sec a{font-size:12px;color:var(--acc);font-weight:600;cursor:pointer}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .ic{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:17px;flex:none}
.row .m{flex:1}.row .m b{display:block;font-size:15px;font-weight:600}.row .m small{font-size:12px;color:var(--mut)}
.row .a{font-family:Fraunces,serif;font-size:17px;font-weight:600}.row .a.i{color:var(--pos)}
.pull{font-family:Fraunces,serif;font-size:21px;line-height:1.3;font-weight:400;font-style:italic;padding:16px 0 16px 16px;border-left:3px solid var(--acc)}
.btn{all:unset;cursor:pointer;display:block;text-align:center;padding:16px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;border-radius:4px;margin-top:16px}
.btn.o{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:16px 0 4px}
.tabs span{padding:10px 0;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer;margin-bottom:-1px}.tabs span.on{color:var(--ink);border-bottom:2px solid var(--acc)}
.bar{height:6px;background:var(--line);margin-top:8px}.bar i{display:block;height:100%;background:var(--ink)}.bar i.o{background:var(--acc)}
.bl{padding:14px 0;border-bottom:1px solid var(--line)}.bl .h{display:flex;justify-content:space-between;font-size:15px;font-weight:600}.bl .h span:last-child{font-family:Fraunces,serif}
.bigamt{font-family:Fraunces,serif;font-size:80px;font-weight:600;letter-spacing:-.05em;text-align:center;margin:26px 0 10px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px}.keys button{all:unset;cursor:pointer;text-align:center;padding:16px 0;font-family:Fraunces,serif;font-size:26px;border-top:1px solid var(--line)}
.keys button:active{color:var(--acc)}
.chp{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chp span{padding:8px 14px;border:1px solid var(--ink);border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}.chp span.on{background:var(--ink);color:var(--bg)}
.chart{display:flex;align-items:flex-end;gap:10px;height:130px;border-bottom:1.5px solid var(--ink);margin-top:16px}.chart div{flex:1;background:var(--soft);border:1px solid var(--ink)}.chart div.on{background:var(--acc);border-color:var(--acc)}
.chl{display:flex;gap:10px;font-size:11px;color:var(--mut);font-weight:600;margin-top:6px}.chl span{flex:1;text-align:center}
.nav{flex:none;display:flex;border-top:1.5px solid var(--ink);padding:10px 8px 22px;background:var(--bg)}
.nav button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;padding:6px 0}
.nav button.on{color:var(--ink)}.nav button.on::after{content:"";display:block;width:18px;height:3px;background:var(--acc);margin:6px auto 0}
.nav .add{color:var(--acc)}.nav .add b{font-size:22px;display:block;line-height:1;font-family:Fraunces,serif}
.anim{animation:in .4s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(max-width:1000px){body{grid-template-columns:390px}.side,.rt{display:none}}
</style></head><body>
<aside class="side"><h1>Zen<em>Spend</em><br>Editorial</h1><p>Design #4 · magazine jaisa. Serif numbers, kaagaz ka rang, patli lines, ek hi accent (terracotta). Shaant aur serious.</p><div class="nl" id="nl"></div></aside>
<div class="phone"><div class="screen"><div class="status"><span>9:41</span><span>●●● ▮</span></div><div class="view" id="view"></div><div class="nav" id="nav"></div></div></div>
<aside class="rt side"><p>Cards ki jagah <b>lines aur typography</b>. Kam rang, zyada hierarchy. Light/dark dono me paper-vs-ink feel.</p><button class="tgl" id="tgl">🌙 Dark / Light</button></aside>
<script>
const f=n=>'₹'+Math.abs(n).toLocaleString('en-IN');
const T=[['Swiggy','🍔','Food · 8:42 PM',-486],['Salary · Acme','💼','Income · 10:00 AM',85000],['Uber','🚕','Travel · Yesterday',-212],['Amazon','🛍️','Shopping · Yesterday',-2299],['Electricity','💡','Bills · 2 Nov',-1840]];
const row=t=>`<div class="row"><div class="ic">${t[1]}</div><div class="m"><b>${t[0]}</b><small>${t[2]}</small></div><div class="a ${t[3]>0?'i':''}">${t[3]>0?'+':'−'}${f(t[3])}</div></div>`;
let amt='1250',cat=0;const S={};
S.home=()=>`<div class="eyebrow">Wednesday, 4 November</div><h1 class="t" style="margin-top:6px">Good evening,<br>Rajesh.</h1>
<div class="rule"></div><div class="eyebrow">Net worth</div><div class="hero"><sup>₹</sup>1,24,580</div><div class="delta">▲ ₹8,420 this month</div>
<div class="hr" style="margin-top:18px"></div>
<div class="cols"><div><div class="eyebrow">Income</div><div class="num">${f(85000)}</div></div><div><div class="eyebrow">Spent</div><div class="num" style="color:var(--acc)">${f(31240)}</div></div></div><div class="hr"></div>
<div class="pull" style="margin-top:20px">Food pe is mahine ₹1,240 bach sakte ho.</div>
<div class="sec"><b>Recent</b><a onclick="go('activity')">See all →</a></div><div class="hr"></div>${T.slice(0,3).map(row).join('')}`;
S.activity=()=>`<h1 class="t">Activity</h1><div class="tabs"><span class="on">All</span><span>Expense</span><span>Income</span><span>Transfer</span></div>
<div class="sec"><b>Today</b><span class="eyebrow">+₹84,514</span></div>${T.slice(0,2).map(row).join('')}<div class="sec"><b>Earlier</b></div>${T.slice(2).map(row).join('')}`;
S.add=()=>`<div style="display:flex;justify-content:space-between"><a class="eyebrow" onclick="go('home')" style="cursor:pointer">✕ Close</a><span class="eyebrow">Axis Bank ▾</span></div>
<div class="tabs" style="justify-content:center"><span class="on">Expense</span><span>Income</span><span>Transfer</span></div>
<div class="bigamt"><span style="font-size:34px;color:var(--mut)">₹</span>${Number(amt||0).toLocaleString('en-IN')}</div>
<div class="chp">${['Food','Shopping','Travel','Bills','Fun'].map((c,i)=>`<span class="${i==cat?'on':''}" onclick="cat=${i};render(1)">${c}</span>`).join('')}</div>
<div class="keys" style="margin-top:18px">${[1,2,3,4,5,6,7,8,9,'.',0,'⌫'].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}</div><div class="btn" onclick="go('home')">Save transaction</div>`;
S.budget=()=>{const b=[['Food',6200,8000],['Shopping',7400,7000],['Travel',2100,4000],['Bills',5800,6500]];return `<div class="eyebrow">November</div><h1 class="t">Budgets</h1><div class="rule"></div>
<div class="eyebrow">Left to spend</div><div class="hero" style="font-size:52px"><sup>₹</sup>4,000</div><div class="bar"><i style="width:78%"></i></div><div class="eyebrow" style="margin-top:8px">₹14,000 of ₹18,000 spent</div>
<div class="sec"><b>Categories</b><a>+ New</a></div><div class="hr"></div>${b.map(x=>{const o=x[1]>x[2];return `<div class="bl"><div class="h"><span>${x[0]}${o?' <span class="eyebrow" style="color:var(--acc)">· over</span>':''}</span><span>${f(x[1])} <span style="color:var(--mut);font-size:13px">/ ${f(x[2])}</span></span></div><div class="bar"><i class="${o?'o':''}" style="width:${Math.min(100,x[1]/x[2]*100)}%"></i></div></div>`}).join('')}`};
S.insights=()=>{const m=[['Jun',45],['Jul',60],['Aug',38],['Sep',72],['Oct',58],['Nov',90]];return `<h1 class="t">Insights</h1><div class="tabs"><span>Week</span><span class="on">Month</span><span>Year</span></div>
<div class="eyebrow" style="margin-top:16px">Spending trend</div><div class="hero" style="font-size:46px"><sup>₹</sup>31,240</div>
<div class="chart">${m.map((x,i)=>`<div class="${i==5?'on':''}" style="height:${x[1]}%"></div>`).join('')}</div><div class="chl">${m.map(x=>`<span>${x[0]}</span>`).join('')}</div>
<div class="cols" style="margin-top:18px;border-top:1px solid var(--line)"><div><div class="eyebrow">Top category</div><div class="num">Food 31%</div></div><div><div class="eyebrow">Savings rate</div><div class="num" style="color:var(--pos)">63%</div></div></div><div class="hr"></div>
<div class="pull" style="margin-top:20px">Swiggy pe 14 baar kharch hua. Hafte me 2 baar kam karo to ₹1,240/mo bachenge.</div>`};
const sc=[['home','Home'],['activity','Activity'],['add','Add'],['budget','Budgets'],['insights','Insights']];let cur='home';
function go(s){cur=s;render()}function key(k){if(k==='⌫')amt=amt.slice(0,-1);else if(k!=='.'&&amt.length<8)amt+=k;render(1)}
function render(keep){const v=document.getElementById('view'),t=v.scrollTop;v.innerHTML=`<div class="${keep?'':'anim'}">${S[cur]()}</div>`;v.scrollTop=keep?t:0;
nl.innerHTML=sc.map(s=>`<button class="${s[0]==cur?'on':''}" onclick="go('${s[0]}')">${s[1]}</button>`).join('');
nav.innerHTML=['home','activity','add','budget','insights'].map(k=>k=='add'?`<button class="add" onclick="go('add')"><b>＋</b>Add</button>`:`<button class="${k==cur?'on':''}" onclick="go('${k}')">${sc.find(s=>s[0]==k)[1]}</button>`).join('');nav.style.display=cur==='add'?'none':'flex'}
tgl.onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'};render();
</script></body></html>
